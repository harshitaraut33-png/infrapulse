# Render deployment. The free instance type gives 512 MB RAM, which is tight for PyTorch
# but workable - the app pins torch and OpenCV to a single thread to keep the footprint
# down. See DEPLOY.md, which also documents a Cloudflare Tunnel fallback.
services:
  - type: web
    name: infrapulse
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: INFRAPULSE_SECRET
        generateValue: true
      - key: STAFF_PASSWORD
        sync: false
