{% extends "base.html" %}
{% block content %}
<div class="panel narrow">
  <h2>Log in</h2>
  <p class="muted">Residents and staff both log in here — you are sent to the right portal
     automatically.</p>
  <form method="post" action="/login">
    <label>Email<input type="email" name="email" value="{{ email or '' }}" required autofocus></label>
    <label>Password<input type="password" name="password" required></label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">No account? <a href="/register">Register as a resident</a>.</p>
</div>
{% endblock %}
